<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel · Izabelle Lima</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <!-- Entrada -->
  <div id="login" class="login hidden">
    <form class="login-card" id="login-form">
      <span class="script login-mono">il</span>
      <h1 class="caps" data-studio>Izabelle Lima</h1>
      <p class="muted">Painel de gestão</p>
      <div class="field remote-only hidden">
        <label for="email">E-mail</label>
        <input class="input" id="email" type="email" autocomplete="username" placeholder="seu@email.com">
      </div>
      <div class="field">
        <label for="pin">Senha</label>
        <input class="input pin" id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
      </div>
      <button class="btn btn-primary btn-block" id="login-btn">Entrar</button>
      <div class="remote-only hidden login-links">
        <button type="button" class="btn btn-ghost btn-sm" id="to-signup">Primeiro acesso? Criar conta</button>
        <button type="button" class="btn btn-ghost btn-sm" id="forgot">Esqueci a senha</button>
      </div>
      <a class="tiny muted" href="index.html">‹ Voltar para o site</a>
    </form>
  </div>

  <!-- Painel -->
  <div id="app" class="app hidden">
    <aside class="side">
      <div class="side-brand">
        <span class="script">il</span>
        <div><strong class="caps" data-studio>Izabelle Lima</strong><span class="script sub">Painel</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <a href="index.html" target="_blank" class="btn btn-ghost btn-sm">Ver site da cliente ↗</a>
        <button class="btn btn-ghost btn-sm" id="logout"></button>
      </div>
    </aside>
    <main class="main">
      <div id="demo-banner" class="demo hidden"></div>
      <div id="view"></div>
    </main>
  </div>

  <div id="tip" class="tip hidden" role="tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
